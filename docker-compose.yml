version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superhero-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the local database directory to persist data
      - ./backend/data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_PATH=/app/data/superheroes.db
    networks:
      - superhero-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: superhero-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - superhero-network
    restart: unless-stopped

networks:
  superhero-network:
    driver: bridge

volumes:
  superhero-data:
    driver: local
